name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release

      - name: Smoke-run every example config
        run: |
          for cfg in examples/*.toml; do
            echo "== $cfg"
            ./target/release/ctsim "$cfg"
          done

      # A fixed seed must give the same graph in a fresh process. Rust randomizes
      # HashSet iteration order per process, so an order-dependent bug can pass
      # inside one `cargo test` run and still break reproducibility across runs.
      - name: Reproducibility holds across separate processes
        run: |
          for i in 1 2 3; do
            cargo test --release --test reproducibility
          done

      - name: Sweeps are reproducible across separate processes
        run: |
          ./target/release/ctsim sweeps/topology.toml
          mv results/topology/sweep_summary.csv /tmp/topology_a.csv
          rm -rf results/topology
          ./target/release/ctsim sweeps/topology.toml
          diff /tmp/topology_a.csv results/topology/sweep_summary.csv
